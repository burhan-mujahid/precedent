<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Precedent: turn how your team already works into rules your AI agents follow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee787"/><stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)" opacity="0.6"/>

  <!-- mark: a stack of rule cards, the top one checked -->
  <g transform="translate(96 112)">
    <rect x="24" y="0" width="128" height="160" rx="14" fill="#21262d" stroke="#30363d" stroke-width="2"/>
    <rect x="12" y="12" width="128" height="160" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="0" y="24" width="128" height="160" rx="14" fill="#0d1117" stroke="url(#mark)" stroke-width="3"/>
    <rect x="20" y="52" width="60" height="8" rx="4" fill="#30363d"/>
    <rect x="20" y="72" width="88" height="8" rx="4" fill="#30363d"/>
    <rect x="20" y="92" width="74" height="8" rx="4" fill="#30363d"/>
    <circle cx="94" cy="148" r="20" fill="url(#mark)"/>
    <path d="M84 148l7 7 13-14" fill="none" stroke="#0d1117" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="300" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f0f6fc" letter-spacing="-1.5">Precedent</text>
  <text x="302" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#c9d1d9">Turn how your team already works into rules your AI agents follow,</text>
  <text x="302" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#c9d1d9">and keep those rules true.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600">
    <rect x="302" y="292" width="92" height="40" rx="20" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950"/>
    <text x="348" y="318" text-anchor="middle" fill="#3fb950">ACT</text>
    <rect x="410" y="292" width="196" height="40" rx="20" fill="#d29922" fill-opacity="0.15" stroke="#d29922"/>
    <text x="508" y="318" text-anchor="middle" fill="#d29922">NEEDS APPROVAL</text>
    <rect x="622" y="292" width="132" height="40" rx="20" fill="#f85149" fill-opacity="0.15" stroke="#f85149"/>
    <text x="688" y="318" text-anchor="middle" fill="#f85149">ESCALATE</text>
  </g>
  <text x="776" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">every agent action, decided by gates outside the model</text>
</svg>
